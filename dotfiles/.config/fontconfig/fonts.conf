<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- 1) Rendering defaults: crisp, neutral, Wayland-friendly -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>          <!-- Turn on anti-aliasing -->
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>          <!-- Enable hinting -->
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>  <!-- Subtle hinting: good for modern LCDs -->
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>  <!-- Balanced LCD filter -->
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>         <!-- Subpixel layout; change to 'none' on grayscale panels -->
  </match>

  <!-- 2) Define your generic families (what most apps ask for) -->
  <alias>  <!-- serif → Noto Serif first -->
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>                 <!-- Primary serif -->
      <family>Noto Serif CJK SC</family>          <!-- CJK fallback (Simplified Chinese) -->
      <family>Noto Serif CJK JP</family>          <!-- CJK fallback (Japanese) -->
      <family>Noto Serif CJK KR</family>          <!-- CJK fallback (Korean) -->
      <family>Liberation Serif</family>           <!-- Extra Latin fallback -->
    </prefer>
  </alias>

  <alias>  <!-- sans-serif → Noto Sans first -->
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>                  <!-- Primary sans -->
      <family>Fira Sans</family>                  <!-- Secondary sans (installed) -->
      <family>Noto Sans CJK SC</family>           <!-- CJK fallback (SC) -->
      <family>Noto Sans CJK JP</family>           <!-- CJK fallback (JP) -->
      <family>Noto Sans CJK KR</family>           <!-- CJK fallback (KR) -->
      <family>DejaVu Sans</family>                <!-- Broad Latin symbols/coverage -->
    </prefer>
  </alias>

  <alias>  <!-- monospace → FiraCode Nerd (Mono) for dev + glyphs -->
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>    <!-- Monospace w/ powerline & symbols -->
      <family>Fira Code</family>                  <!-- Vanilla Fira Code -->
      <family>Noto Sans Mono</family>             <!-- Clean mono fallback -->
      <family>DejaVu Sans Mono</family>           <!-- Wide coverage mono fallback -->
      <family>Liberation Mono</family>            <!-- Additional mono fallback -->
    </prefer>
  </alias>

  <!-- 3) Emoji: always keep a color-emoji fallback in the stack -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>           <!-- Your color emoji font -->
    </prefer>
  </alias>

  <!-- 4) Global last-resort fallbacks for missing glyphs (safe to append) -->
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Symbols Nerd Font</string>           <!-- Emoji if a codepoint needs it -->
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>          <!-- Extra icons/powerline if needed -->
    </edit>
  </match>

</fontconfig>