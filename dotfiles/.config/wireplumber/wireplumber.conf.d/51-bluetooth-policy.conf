monitor.bluez.properties = {
  # Codec priority list — PipeWire negotiates from left to right
  bluez5.codecs = [ ldac sbc_xq aac sbc ]

  # Enable mSBC for HFP wideband voice (better mic quality when on calls)
  bluez5.enable-msbc = true

  # Enable SBC-XQ (high-quality SBC variant, fallback if LDAC fails)
  bluez5.enable-sbc-xq = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        # Auto-connect to A2DP sink on device connect
        bluez5.auto-connect = [ a2dp_sink ]

        # LDAC quality: hq = 990kbps, sq = 660kbps, auto = adaptive
        # Use sq if you experience dropouts; hq on a stable desktop/ThinkPad is fine
        bluez5.a2dp.ldac.quality = hq
      }
    }
  }
]
