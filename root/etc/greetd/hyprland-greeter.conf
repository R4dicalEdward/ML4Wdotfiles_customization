# /etc/greetd/hyprland-greeter.conf
# Minimal Hyprland config for greeter
# monitor = DP-2, 3840x2160@60, 0x0, 1       # Use 4K monitor only for greeter
# monitor = DP-3, 2560x1440@60, 2560x0, 1    # Optionally disable or place second
exec-once = regreet; hyprctl dispatch exit
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}