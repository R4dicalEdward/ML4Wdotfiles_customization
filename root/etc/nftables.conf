#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4/IPv6 Simple & Safe firewall ruleset.
# More examples in /usr/share/nftables/ and /usr/share/doc/nftables/examples/.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport ssh accept comment "allow sshd"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
  }
}
table inet opencode_egress {
  chain output {
    type filter hook output priority 0; policy accept;

    # Match traffic from the opencode cgroup slice
    socket cgroupv2 level 5 "user.slice/user-1000.slice/user@1000.service/opencode.slice" \
      jump opencode_allowed
  }

  chain opencode_allowed {
    # DNS
    udp dport 53 accept
    tcp dport 53 accept

    # AI providers and package registries (resolve at reload time)
    ip daddr { 104.18.0.0/15, 172.64.0.0/13 } tcp dport 443 accept   # Cloudflare (anthropic.com)
    ip daddr 104.18.12.101 tcp dport 443 accept   # openai.com — verify with dig
    tcp dport 443 ct state established,related accept

    # Block everything else from this slice
    log prefix "opencode-blocked: " drop
  }
}
